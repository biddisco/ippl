  script:
    - date
    - cd $BUILD_DIR/
    - mkdir -p bin/data
    - srun -n 4 --uenv=${SLURM_UENV} --view=${SLURM_UENV_VIEW} $WRAPPER ./bin/LandauDamping 16 16 16 10000000 100 FFT 0.01 LeapFrog --overallocate 2.0 --info 10
    - ctest --output-on-failure --timeout 60
    - date
